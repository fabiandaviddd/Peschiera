<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peschiera kompakt</title>
<meta name="description" content="Nachschlagewerk für Peschiera del Garda: Essen, Café, Sehen, Ausflüge und Praktisches — mit Hundefilter.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14150F" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peschiera">

<!-- iOS-Startbilder (Portrait) -->
<link rel="apple-touch-startup-image" href="./icons/splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./icons/splash-828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="./icons/splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">

<!-- Keine externe Quelle mehr. Die Schriften liegen seit v23 unter ./fonts/;
     das Stylesheet von fonts.googleapis.com blockierte das erste Rendern.
     Vorgeladen wird nur, was sicher gebraucht wird: die beiden latin-Dateien.
     latin-ext holt der Browser selbst, sobald ein Zeichen daraus vorkommt.
     crossorigin ist auch bei eigenen Schriften Pflicht -- ohne das Attribut
     laedt der Browser die Datei ein zweites Mal. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/fraunces-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/karla-latin.woff2">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<a class="skip" href="#main">Zum Inhalt springen</a>

<!-- Start- und Fehlerzustand.

     Bis v23 stand hier ein drehender Kreis. Der sagt "warte", ein Geruest
     sagt "so wird es aussehen" -- und am See mit einem Balken Empfang ist
     das der Unterschied zwischen "laedt" und "kaputt". Die Formen unten
     bilden nach, was danach wirklich kommt: Kopfzeile, Filterzeile, dann
     Karten mit Name, zwei Marken und zwei Textzeilen.

     aria-hidden, weil ein Vorleser mit leeren Kaesten nichts anfangen kann.
     Was er braucht, steht in .boot__msg, und die traegt role="status" --
     ohne das bliebe ein Fehler beim Laden fuer ihn stumm.

     Im Fehlerfall setzt app.js .boot--fehler: dann verschwindet das Geruest.
     Es weiter zu zeigen waere ein Versprechen, das die App nicht mehr
     einloest. -->
<div id="boot" class="boot">
  <div class="boot__msg" role="status">
    <h2 id="boot-title">Peschiera kompakt</h2>
    <p id="boot-text">Daten werden geladen&hellip;</p>
    <button type="button" class="btn btn--primary" id="boot-retry" hidden>Erneut versuchen</button>
  </div>
  <div class="boot__skel" id="boot-skel" aria-hidden="true">
    <div class="skel skel--kopf"></div>
    <div class="skel skel--chips"></div>
    <div class="skel skel--karte"></div>
    <div class="skel skel--karte"></div>
    <div class="skel skel--karte"></div>
  </div>
</div>

<div id="app" hidden>

  <!-- Der Kopf liegt fix, nicht sticky: beim Einklappen wuerde ein sticky
       Kopf Platz aus dem Fluss nehmen und die Liste unter dem Finger
       wegspringen. .main traegt dafuer --bar-full als Abstand oben. -->
  <header class="bar">
    <!-- Faehrt beim Scrollen nach unten weg, die Filterzeile bleibt stehen. -->
    <div class="bar__top" id="bar-top">
      <div class="wrap">
        <div class="bar__row">
          <!-- Inhalt setzt render() je Ansicht: seit v35 steht hier, wo man
               ist und was gerade gilt, statt auf allen vier Ansichten
               derselbe App-Name. -->
          <h1 class="bar__title" id="bar-title"><em>Peschiera</em> kompakt</h1>
          <button type="button" class="switch" id="jum-btn" role="switch" aria-checked="false">
            <span class="switch__box" aria-hidden="true"><span class="switch__knob"></span></span>
            <span class="switch__lbl">Mit Jum</span>
          </button>
          <!-- Inhalt setzt applyTheme() beim Start neu, samt Symbol und Ziel. -->
          <button type="button" class="icon-btn" id="theme-btn" aria-live="polite">
            <span class="sr-only">Farbschema umschalten</span>
          </button>
        </div>

        <div class="search" id="search-wrap">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
          <input type="search" id="q" class="search__input" enterkeyhint="search"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 placeholder="Name, Adresse, Notiz, Tag"
                 aria-label="Orte durchsuchen">
          <button type="button" class="search__clear" id="q-clear" hidden aria-label="Suche löschen">&times;</button>
        </div>
      </div>
    </div>

    <!-- Eine Zeile statt zweier scrollender Chipreihen: ein Knopf fuer alle
         Filter, daneben nur die, die gerade an sind, rechts die Sortierung. -->
    <div class="filterbar" id="filters">
      <div class="wrap filterbar__wrap">
        <button type="button" class="chip chip--filter" id="chip-filter" aria-haspopup="dialog"></button>
        <div class="filterbar__active" id="active-filters"></div>
        <button type="button" class="chip chip--map" id="map-btn"></button>
        <button type="button" class="chip chip--sort" id="sort-btn"></button>
      </div>
    </div>
  </header>

  <main class="main" id="main">
    <div class="wrap">
      <div class="inbox" id="inbox" hidden role="region" aria-labelledby="inbox-t">
        <h2 class="inbox__t" id="inbox-t">Liste erhalten</h2>
        <p class="inbox__x" id="inbox-x"></p>
        <!-- Reihenfolge ist Absicht: der empfohlene Weg zuerst, der folgenlose
             danach, der destruktive zuletzt und optisch abgesetzt. Vorher
             standen "Meine ersetzen" und "Verwerfen" gleich aus, obwohl einer
             vierzehn Tage Markierungen kostet und der andere nichts. -->
        <div class="inbox__acts">
          <button type="button" class="btn btn--primary btn--wide" id="inbox-merge">Zusammenführen</button>
          <button type="button" class="btn btn--wide" id="inbox-cancel">Verwerfen</button>
          <button type="button" class="btn btn--wide btn--danger" id="inbox-replace">Meine ersetzen</button>
          <button type="button" class="btn btn--wide btn--primary" id="inbox-undo" hidden>Rückgängig</button>
        </div>
      </div>

      <div class="sharebar" id="sharebar" hidden>
        <p class="sharebar__t" id="sharebar-t"></p>
        <button type="button" class="btn" id="share-btn"></button>
      </div>

      <div class="meta" id="meta-row">
        <p id="count" role="status" aria-live="polite"></p>
      </div>

      <div class="today" id="today" hidden></div>
      <div class="list" id="list"></div>
      <!-- Leaflet wird erst beim ersten Oeffnen geladen, siehe ladeKarte(). -->
      <div class="map" id="map" hidden></div>
      <p class="map__note" id="map-note" hidden></p>
      <div id="info"></div>

      <div class="empty" id="empty" hidden>
        <h2 id="empty-h">Nichts gefunden</h2>
        <p id="empty-p"></p>
        <button type="button" class="btn" id="empty-reset">Filter zurücksetzen</button>
      </div>

      <footer class="foot">
        <p id="foot-sub"></p>
        <p id="foot-note"></p>
        <p id="foot-offline"></p>
      </footer>
    </div>
  </main>

  <nav class="tabs" aria-label="Ansicht">
    <div class="tabs__inner" id="tabs"></div>
  </nav>
</div>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <div class="sheet__grip" id="grip" aria-hidden="true"><span></span></div>
  <button type="button" class="sheet__close" id="sheet-close" aria-label="Schließen">&times;</button>
  <div class="sheet__body" id="sheet-body"></div>
</section>

<script src="./app.js"></script>
</body>
</html>
